abstract: "Charles et al. (2025) derived scaling laws for DiLoCo, a low-communication method for training language models across workers that synchronize only every H steps, and gave hyperparameter guidance along the way. We test five of their qualitative findings with an independent implementation, at a scale that fits on one consumer GPU: a 30M-parameter model trained from scratch on TinyStories, with up to eight workers simulated sequentially. Four findings reproduce: evaluation loss grows with H; the best outer learning rate grows with the number of workers; at small model size DiLoCo trails data-parallel training by a margin that widens with more workers; and a single DiLoCo worker beats plain AdamW, though here only at a short sync interval. The fifth, that the best outer learning rate grows with H, holds at a fixed token budget but is better explained by the number of outer rounds, which shrinks as H grows: a learning rate of 1.0 beats 0.7 only in runs with 16 or fewer rounds, both when H varies at a fixed number of rounds and when the number of rounds varies at a fixed H. All 126 runs take about 71 GPU-hours; a 3-hour subset reproduces the claims that rest on the smallest differences."

