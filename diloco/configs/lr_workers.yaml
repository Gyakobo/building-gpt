# Experiment 2: does the best outer learning rate depend on the number of workers k?
# (Charles et al., 2025: "the optimal learning rate is essentially only a function of M".)
# H = 100, 4000 steps, Nesterov 0.9. Outer lr 0.7 at k = 2 and 8, and the full lr grid
# at k = 4, already exist and are skipped automatically.
base:
  mode: diloco
  H: 100
  steps: 4000
  seed: 0
sweep:
  k: [2, 8]
  outer_lr: [0.3, 0.5, 0.7, 1.0, 1.3]
runs:
  - {k: 4, outer_lr: 1.3}
